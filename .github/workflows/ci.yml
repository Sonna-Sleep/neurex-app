name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run smoke checks
        run: |
          npm run smoke:backoff
          npm run smoke:connect-timeout
          npm run smoke:account-deletion
          npm run smoke:profile
          npm run smoke:push
          npm run smoke:dob
          npm run smoke:hypnogram
          npm run smoke:ble-packet
          npm run smoke:ble-reboot
          npm run smoke:ble-watchdog
          npm run smoke:ble-scale
          npm run smoke:diagnostic-capture
          npm run smoke:raw-record
          npm run smoke:disk-space
          npm run smoke:auto-stop
          npm run smoke:upload-lock
          npm run smoke:chunk-queue
          npm run smoke:chunk-upload
          npm run smoke:chunk-uploader
          npm run smoke:seg-roll
          npm run smoke:session-metadata
          npm run smoke:stream-stats
          npm run smoke:recovery
          npm run smoke:support
          npm run check:android-push
