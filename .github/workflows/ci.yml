name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run smoke checks
        run: |
          npm run smoke:backoff
          npm run smoke:connect-timeout
          npm run smoke:account-deletion
          npm run smoke:profile
          npm run smoke:push
          npm run smoke:ble-packet
          npm run smoke:recovery
          npm run smoke:support
